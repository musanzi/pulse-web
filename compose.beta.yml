services:
  caddy:
    image: caddy:2.10-alpine
    container_name: pulse-beta-proxy
    restart: unless-stopped
    depends_on:
      admin:
        condition: service_healthy
      website:
        condition: service_healthy
    environment:
      ADMIN_ADDRESS: ${ADMIN_ADDRESS:-http://admin.localhost}
      API_UPSTREAM: ${API_UPSTREAM:-host.docker.internal:8000}
      WEBSITE_ADDRESS: ${WEBSITE_ADDRESS:-http://app.localhost}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-config:/config
      - caddy-data:/data

  website:
    build:
      context: .
      target: production
    restart: unless-stopped
    command: node dist/website/server/server.mjs
    environment:
      ALLOWED_HOSTS: ${WEBSITE_HOST:-app.localhost}
      BETA_ADMIN_HOSTS: ${ADMIN_HOST:-admin.localhost}
      BETA_ALLOWED_ORIGINS: ${ADMIN_ORIGIN:-http://admin.localhost}
      FEEDBACK_DATA_FILE: /app/data/beta-feedback.json
      PORT: 4200
    expose:
      - '4200'
    volumes:
      - beta-feedback-data:/app/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:4200/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  admin:
    build:
      context: .
      target: production
    restart: unless-stopped
    command: node dist/admin/server/server.mjs
    environment:
      ALLOWED_HOSTS: ${ADMIN_HOST:-admin.localhost}
      PORT: 4300
    expose:
      - '4300'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:4300/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  beta-feedback-data:
  caddy-config:
  caddy-data:
