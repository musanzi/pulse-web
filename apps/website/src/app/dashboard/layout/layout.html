<mat-sidenav-container>
  <mat-sidenav
    class="w-70 border-r border-neutral-200 bg-white dark:border-neutral-800 dark:bg-neutral-900"
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
    [disableClose]="!isMobile()"
    fixedInViewport
    #sidenav="matSidenav">
    <dashboard-sidebar />
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="flex items-center border-b px-4 py-2.5">
      <button matIconButton (click)="sidenav.toggle()">
        <mat-icon svgIcon="panel-left" />
      </button>

      <div class="flex-auto"></div>

      <div class="flex items-center gap-x-2">
        @if (showFeedbackShortcut()) {
        <a
          matIconButton
          routerLink="/dashboard/feedback"
          [queryParams]="{ journey: feedbackJourney() }"
          [attr.aria-label]="'betaFeedback.shortcut.label' | transloco"
          [matTooltip]="'betaFeedback.shortcut.label' | transloco">
          <mat-icon svgIcon="message-square-more" />
        </a>
        }
        <ui-language-switcher />
        <ui-scheme-switcher
          [labels]="{
            light: ('theme.light' | transloco),
            dark: ('theme.dark' | transloco),
            system: ('theme.system' | transloco)
          }" />
      </div>
    </div>

    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
