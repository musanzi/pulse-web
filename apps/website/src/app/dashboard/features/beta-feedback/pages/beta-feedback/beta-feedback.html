<div class="mx-auto grid w-full max-w-5xl gap-5 p-4 sm:p-6 lg:p-8">
  <header class="border-b border-neutral-200 pb-5 dark:border-neutral-800">
    <div class="flex items-center gap-2 text-sm font-semibold text-primary-600 dark:text-primary-400">
      <mat-icon class="size-4" svgIcon="message-square-more"></mat-icon>
      {{ 'betaFeedback.eyebrow' | transloco }}
    </div>
    <h1 class="mt-2 text-2xl font-semibold text-neutral-950 dark:text-white sm:text-3xl">
      {{ 'betaFeedback.title' | transloco }}
    </h1>
    <p class="mt-1 max-w-2xl text-sm text-neutral-500 dark:text-neutral-400">
      {{ 'betaFeedback.description' | transloco }}
    </p>
  </header>

  <beta-feedback-form
    [error]="feedbackStore.error()"
    [initialRoute]="initialJourney()"
    [submitted]="!!feedbackStore.lastSubmission()"
    [submitting]="feedbackStore.submitting()"
    (feedbackSubmitted)="submitFeedback($event)"
    (newFeedbackRequested)="feedbackStore.clearConfirmation()" />
</div>
