<section class="flex flex-col gap-6 p-4 sm:p-6 lg:p-8">

  <div>
    <h1 class="text-2xl font-semibold text-on-surface">
      {{ 'peerReviews.title' | transloco }}
    </h1>

    <p class="mt-1 text-sm text-on-surface-variant">
      {{ 'peerReviews.description' | transloco }}
    </p>
  </div>

  <mat-card appearance="outlined"
    class="flex-1 overflow-hidden border-neutral-200 bg-white dark:border-neutral-800 dark:bg-neutral-900">

    <mat-card-content class="flex min-h-[24rem] flex-col items-center justify-center gap-6 p-8 text-center">

      <div
        class="flex size-16 items-center justify-center rounded-lg bg-primary-50 text-primary-700 dark:bg-primary-950/40 dark:text-primary-300">
        <mat-icon svgIcon="users"></mat-icon>
      </div>

      <div class="max-w-lg space-y-3">
        <h2 class="text-2xl font-semibold text-neutral-950 dark:text-white">
          {{ 'peerReviews.empty.title' | transloco }}
        </h2>

        <p class="max-w-md text-sm text-neutral-500 dark:text-neutral-400">
          {{ 'peerReviews.empty.description' | transloco }}
        </p>
      </div>

      <button matButton="filled" type="button" class="mt-2" [routerLink]="['/dashboard/applications']">
        <mat-icon svgIcon="briefcase-business"></mat-icon>
        {{ 'peerReviews.empty.action' | transloco }}
      </button>

    </mat-card-content>
  </mat-card>

</section>
