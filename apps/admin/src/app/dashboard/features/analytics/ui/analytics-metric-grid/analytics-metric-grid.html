<section class="grid gap-3 sm:grid-cols-2 xl:grid-cols-4">
  @for (metric of metrics(); track metric.id) {
  <mat-card appearance="outlined" class="border-neutral-200 bg-white dark:border-neutral-800 dark:bg-neutral-900">
    <mat-card-content class="p-4">
      <div class="flex items-start justify-between gap-3">
        <div class="grid size-9 place-items-center rounded-md bg-neutral-100 dark:bg-neutral-800">
          <mat-icon class="size-4 text-neutral-600 dark:text-neutral-300" [svgIcon]="metric.icon"></mat-icon>
        </div>
        <div
          class="flex items-center gap-1 rounded-full px-2 py-1 text-xs font-semibold"
          [class.bg-emerald-50]="metric.trend === 'up'"
          [class.text-emerald-700]="metric.trend === 'up'"
          [class.dark:bg-emerald-950/40]="metric.trend === 'up'"
          [class.dark:text-emerald-300]="metric.trend === 'up'">
          <mat-icon class="size-3" [svgIcon]="metric.trend === 'down' ? 'trending-down' : 'trending-up'"></mat-icon>
          {{ metric.changePercent | number: '1.1-1' }}%
        </div>
      </div>
      <div class="mt-4 font-mono text-3xl font-semibold text-neutral-950 dark:text-white">
        {{ metric.value | number }}{{ metric.format === 'percent' ? '%' : '' }}
      </div>
      <div class="mt-1 text-sm font-medium text-neutral-500 dark:text-neutral-400">
        {{ metric.labelKey | transloco }}
      </div>
    </mat-card-content>
  </mat-card>
  }
</section>
