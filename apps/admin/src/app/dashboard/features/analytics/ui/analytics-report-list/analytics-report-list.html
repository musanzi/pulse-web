<section
  class="h-full rounded-lg border border-neutral-200 bg-white p-4 dark:border-neutral-800 dark:bg-neutral-900 sm:p-5">
  <div class="flex items-center gap-2">
    <mat-icon class="size-4 text-primary-600 dark:text-primary-400" svgIcon="file-chart-column-increasing"></mat-icon>
    <h2 class="font-semibold text-neutral-950 dark:text-white">{{ 'admin.analytics.reports.title' | transloco }}</h2>
  </div>
  <p class="mt-1 text-sm text-neutral-500 dark:text-neutral-400">
    {{ 'admin.analytics.reports.description' | transloco }}
  </p>

  <div class="mt-4 divide-y divide-neutral-200 dark:divide-neutral-800">
    @for (report of reports(); track report.id) {
    <article class="flex items-center gap-3 py-3 first:pt-0 last:pb-0">
      <div class="grid size-9 shrink-0 place-items-center rounded-md bg-neutral-100 dark:bg-neutral-800">
        <mat-icon class="size-4 text-neutral-500 dark:text-neutral-300" svgIcon="file-down"></mat-icon>
      </div>
      <div class="min-w-0 flex-1">
        <div class="truncate text-sm font-semibold text-neutral-900 dark:text-white">
          {{ report.titleKey | transloco }}
        </div>
        <div class="mt-0.5 text-xs text-neutral-400">{{ report.generatedAt | date: 'medium' }}</div>
      </div>
      <span class="rounded bg-neutral-100 px-2 py-1 font-mono text-xs dark:bg-neutral-800"
        >{{ report.format | uppercase }}</span
      >
      <button matIconButton type="button" [attr.aria-label]="'admin.analytics.reports.download' | transloco">
        <mat-icon svgIcon="download"></mat-icon>
      </button>
    </article>
    }
  </div>
</section>
